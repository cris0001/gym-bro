# Nginx in front of the Lift4Me app (mounted as /etc/nginx/conf.d/default.conf).
# Traffic arrives from Cloudflare; TLS between Cloudflare and this server uses the
# Cloudflare Origin Certificate (Cloudflare SSL mode "Full (strict)"). Nginx terminates
# TLS and proxies everything to the app container on the Docker network.

# Hide the nginx version in responses and error pages.
server_tokens off;

# Food/recipe photos are uploaded through the API.
client_max_body_size 10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

# Plain HTTP only ever redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lift4.me www.lift4.me;

    ssl_certificate     /certs/origin.pem;
    ssl_certificate_key /certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Baseline security headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
