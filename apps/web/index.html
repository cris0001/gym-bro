    <!-- Launch splash for the PWA installed on iOS only: the logo on the app background,
         laid over the app until it has loaded and at least 1.5s have passed (script
         after #root), then faded out. iOS has no launch screen of its own (a blank
         flash otherwise); Android already shows a system one built from the manifest
         icon, so a second splash there would only slow the start. navigator.standalone
         exists only in iOS Safari. Hidden in a normal browser tab. -->
    <script>
      if (navigator.standalone === true) document.documentElement.classList.add('ios-pwa');
    </script>
    <style>
      #boot-splash {
        display: none;
      }
      @media (display-mode: standalone) {
        html:not(.ios-pwa) #boot-splash {
          display: none !important;
        }
        #boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          background: var(--background, #fcfcfd);
          transition: opacity 0.35s ease;
        }
        #boot-splash.is-done {
          opacity: 0;
          pointer-events: none;
        }
        html.dark #boot-splash {
          background: var(--background, #0e1218);
        }
        #boot-splash svg {
          width: min(64vw, 280px);
          height: auto;
          overflow: visible;
        }
      }
    </style>
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong
         theme. Mirrors src/stores/theme.store.ts (key + resolution logic). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gym-bro-theme') || 'system';
          // The landing and auth pages are light-only (see useForceLightTheme in
          // src/hooks/use-force-light-theme.ts) — never start them dark.
          var p = window.location.pathname.replace(/\/+$/, '') || '/';
          var lightOnly =
            p === '/' ||
            p === '/login' ||
            p === '/register' ||
            p === '/privacy' ||
            p === '/terms';
          var dark =
            !lightOnly &&
            (t === 'dark' ||
              (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (dark) document.documentElement.classList.add('dark');
          // Accent palette (src/stores/palette.store.ts): slate is the default and
          // unknown saved ids fall back to it; plum is the CSS base (no attribute).
          var palettes = [
            'slate',
            'plum',
            'forest',
            'lagoon',
            'violet',
            'crimson',
            'signal',
            'mono',
          ];
          var palette = localStorage.getItem('gym-bro-palette');
          if (palettes.indexOf(palette) < 0) palette = 'slate';
          if (!lightOnly && palette !== 'plum')
            document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>

    <script>
      // Keep the launch splash up until the app has loaded and at least 1.5s since
      // launch, then fade it out (it only shows in the PWA installed on iOS; see the CSS).
      (function () {
        var el = document.getElementById('boot-splash');
        if (!el) return;
        if (!document.documentElement.classList.contains('ios-pwa')) {
          el.remove();
          return;
        }
        function hide() {
          setTimeout(function () {
            el.classList.add('is-done');
            setTimeout(function () {
              el.remove();
            }, 400);
          }, Math.max(0, 1500 - performance.now()));
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
      })();
    </script>
