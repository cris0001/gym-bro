<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#f6f3f0" />
    <meta name="apple-mobile-web-app-title" content="Gym Bro" />
    <title>Gym Bro</title>
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong
         theme. Mirrors src/stores/theme.store.ts (key + resolution logic). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gym-bro-theme') || 'system';
          // The landing and auth pages are light-only (see useForceLightTheme in
          // src/hooks/use-force-light-theme.ts) — never start them dark.
          var p = window.location.pathname.replace(/\/+$/, '') || '/';
          var lightOnly = p === '/' || p === '/login' || p === '/register';
          var dark =
            !lightOnly &&
            (t === 'dark' ||
              (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (dark) document.documentElement.classList.add('dark');
          // Accent palette (src/stores/palette.store.ts); plum is the default.
          var palette = localStorage.getItem('gym-bro-palette');
          if (!lightOnly && palette && palette !== 'plum')
            document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
