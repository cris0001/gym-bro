name: Deploy to Fly

# Push to main runs the checks, then deploys to Fly — but only once the FLY_API_TOKEN
# secret exists (the deploy step is skipped until then, so the run stays green before
# the first setup). A broken commit fails typecheck/test and never reaches deploy.
on:
  push:
    branches: [main]

# Never run two deploys of the same branch at once; let the newest win.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from the repo's packageManager field via Corepack.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Setup flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Remote builder — no Docker needed in the runner.
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
